name: DE-1 ELT (Airflow + dbt)

on:
  push:
    branches: [main]
    paths:
      - "01-data-engineer/de-01-elt-airflow-dbt/**"
      - ".github/workflows/de-01-elt-airflow-dbt.yml"
  pull_request:
    paths:
      - "01-data-engineer/de-01-elt-airflow-dbt/**"
      - ".github/workflows/de-01-elt-airflow-dbt.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-data-engineer/de-01-elt-airflow-dbt

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 01-data-engineer/de-01-elt-airflow-dbt/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and database tests
        run: pytest -q tests
        env:
          RUN_DB_TESTS: "1"

      - name: Load sample data into raw schema
        run: python -m ingestion.load_raw --data-dir data/sample

      - name: dbt source freshness
        working-directory: 01-data-engineer/de-01-elt-airflow-dbt/dbt
        run: dbt source freshness --profiles-dir .

      - name: dbt build (models + 70 tests)
        working-directory: 01-data-engineer/de-01-elt-airflow-dbt/dbt
        run: dbt build --profiles-dir .

      - name: Check the DAG imports cleanly
        # Separate virtualenv: Airflow's constraints would conflict with dbt's dependencies.
        run: |
          python -m venv /tmp/airflow-venv
          /tmp/airflow-venv/bin/pip install -q "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          AIRFLOW__CORE__LOAD_EXAMPLES=false /tmp/airflow-venv/bin/python -c "from airflow.models import DagBag; b = DagBag('dags', include_examples=False); assert not b.import_errors, b.import_errors; print(list(b.dags))"
