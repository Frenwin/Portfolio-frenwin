apiVersion: 1

datasources:
  - name: Streaming Postgres
    uid: streaming-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: streaming
    isDefault: true
    secureJsonData:
      password: streaming
    jsonData:
      database: streaming
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
