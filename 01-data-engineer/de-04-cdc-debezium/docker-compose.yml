# Start:            docker compose up -d --build
# Register + demo:  docker compose run --rm history python -m cdc.demo
# Kafka Connect:    http://localhost:8083/connectors
# Source DB:        localhost:5436 (shop / shop) · Replica DB: localhost:5437 (replica / replica)

x-app: &app
  image: cdc-app:1.0
  pull_policy: never
  environment:
    KAFKA_BOOTSTRAP: kafka:29092
    CONNECT_URL: http://connect:8083
    SOURCE_DSN: host=source-db port=5432 dbname=shop user=shop password=shop
    REPLICA_DSN: host=replica-db port=5432 dbname=replica user=replica password=replica
  volumes:
    - ./cdc:/app/cdc
    - ./connectors:/app/connectors
    - ./tests:/app/tests
    - ./docs:/app/docs

services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Single broker: one offsets partition instead of 50 keeps startup light (see README, "What went wrong").
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  source-db:
    image: postgres:16
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5436:5432"
    volumes:
      - ./source-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  replica-db:
    image: postgres:16
    environment:
      POSTGRES_USER: replica
      POSTGRES_PASSWORD: replica
      POSTGRES_DB: replica
    ports:
      - "5437:5432"
    volumes:
      - ./replica-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replica -d replica"]
      interval: 5s
      timeout: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy
      replica-db:
        condition: service_healthy

  history:
    <<: *app
    build: ./app
    pull_policy: build
    command: python -m cdc.history
    depends_on:
      connect:
        condition: service_healthy
