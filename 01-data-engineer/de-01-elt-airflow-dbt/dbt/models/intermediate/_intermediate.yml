version: 2

models:
  - name: int_zip_code_locations
    description: Average location per zip code prefix after removing points outside Brazil.
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: int_customer_versions
    description: Maps every order-level customer_id to the address version of its customer_unique_id (SCD2 source).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_sk
        data_tests: [not_null]

  - name: int_order_items_summary
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_payments_summary
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_reviews_summary
    columns:
      - name: order_id
        data_tests: [unique, not_null]
