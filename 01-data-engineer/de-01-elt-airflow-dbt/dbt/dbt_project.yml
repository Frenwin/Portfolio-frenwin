name: olist_warehouse
version: "1.0.0"
config-version: 2
profile: olist_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # fct_order_items reprocesses this many days before its latest order on incremental runs
  lookback_days: 3

models:
  olist_warehouse:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
