# One command: docker compose up -d --build
# Airflow UI: http://localhost:8080 (admin / admin) · Warehouse: localhost:5434 (warehouse / warehouse)

x-airflow-common: &airflow-common
  # Built once by airflow-init; the webserver and scheduler reuse the same local image.
  image: olist-airflow:2.10.5-dbt1.9
  pull_policy: never
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-env}
    PYTHONPATH: /opt/airflow
    OLIST_DATA_DIR: /opt/airflow/data/raw
    DBT_PROJECT_DIR: /opt/airflow/dbt
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: warehouse
    WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: warehouse
    ports:
      - "${WAREHOUSE_HOST_PORT:-5434}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    build: ./airflow
    pull_policy: build
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
